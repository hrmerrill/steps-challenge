version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: steps_user
      POSTGRES_PASSWORD: steps_password
      POSTGRES_DB: steps_challenge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://steps_user:steps_password@db:5432/steps_challenge
      - JWT_SECRET=CHANGE_ME_TO_A_SECURE_RANDOM_STRING
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
